<title>{{ .Title }} | {{ .Site.Params.siteName }}</title>
<meta name="description" content="{{ .Params.description | default .Site.Params.description }}">

<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Params.description | default .Site.Params.description }}">
<meta property="og:image" content="{{ (.Params.image | default .Site.Params.ogImage) | absURL }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ .Site.Params.siteName }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Params.description | default .Site.Params.description }}">
<meta name="twitter:image" content="{{ (.Params.image | default .Site.Params.ogImage) | absURL }}">

<meta name="robots" content="{{ .Params.robots | default "index, follow" }}">
