{{ $org := .Site.Params }}
{{ $product := .Params.product_schema | default dict }}
{{ $faqItems := .Params.faq_items | default slice }}
{{ $blogFaq := .Params.faq_schema | default slice }}
{{ $breadcrumb := .Params.breadcrumb_schema | default slice }}
{{ $article := .Params.schema | default dict }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": "{{ $org.orgName }}",
      "url": "{{ $org.orgURL }}",
      "logo": "{{ "images/logo.svg" | absURL }}",
      "description": "{{ $org.description }}",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "{{ $org.contactEmail }}",
        "availableLanguage": "English"
      }
    }{{ with $product }},
    {{ . | safeJS }}{{ end }}{{ if $faqItems }},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {{- range $i, $item := $faqItems -}}
        {{ if $i }},{{ end }}
        {
          "@type": "Question",
          "name": {{ $item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $item.answer | jsonify }}
          }
        }
        {{- end -}}
      ]
    }{{ end }}{{ if $blogFaq }},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {{- range $i, $item := $blogFaq -}}
        {{ if $i }},{{ end }}
        {
          "@type": "Question",
          "name": {{ $item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $item.answer | jsonify }}
          }
        }
        {{- end -}}
      ]
    }{{ end }}{{ with $article }},
    {{ . | safeJS }}{{ end }}{{ range $breadcrumb }},
    {{ . | safeJS }}{{ end }}
  ]
}
</script>
