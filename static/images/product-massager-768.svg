<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <!-- Bathroom/spa setting -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <!-- Tile pattern -->
    <pattern id="tile" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none" stroke="#94a3b8" stroke-width=".5" opacity=".15"/>
    </pattern>
    <!-- Water drop gradient -->
    <radialGradient id="water" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <!-- Product gradient - matte ABS -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="40%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <!-- Silicone tip gradient -->
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="50%" style="stop-color:#bfdbfe"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <filter id="waterGlow"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#64748b" flood-opacity=".2"/></filter>
  </defs>

  <!-- Background - spa bathroom tiles -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#tile)"/>

  <!-- Counter surface -->
  <rect x="0" y="750" width="1200" height="30" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="0" y="780" width="1200" height="420" fill="#e2e8f0" opacity=".5"/>

  <!-- === SCALP MASSAGER === -->

  <!-- Handle (ergonomic grip) -->
  <g filter="url(#shadow)">
    <path d="M520,250 Q520,200 540,170 Q560,140 580,130 L620,130 Q640,140 660,170 Q680,200 680,250 L680,680 Q680,730 660,760 Q640,790 620,800 L580,800 Q560,790 540,760 Q520,730 520,680 Z"
          fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Grip texture lines -->
    <line x1="545" y1="380" x2="655" y2="380" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="410" x2="655" y2="410" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="440" x2="655" y2="440" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="470" x2="655" y2="470" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="500" x2="655" y2="500" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="530" x2="655" y2="530" stroke="#94a3b8" stroke-width="1" opacity=".3"/>
    <line x1="545" y1="560" x2="655" y2="560" stroke="#94a3b8" stroke-width="1" opacity=".3"/>

    <!-- Power button on handle -->
    <rect x="575" y="600" width="50" height="28" rx="14" fill="#292524"/>
    <circle cx="602" cy="614" r="8" fill="#c97b5d" opacity=".8"/>

    <!-- === MASSAGE HEAD (TOP) === -->
    <circle cx="600" cy="200" r="90" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Massage nodes - 4 on top -->
    <!-- Top-left node -->
    <circle cx="550" cy="170" r="30" fill="url(#tipGrad)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="550" cy="170" r="15" fill="#6366f1" opacity=".15"/>
    <circle cx="550" cy="170" r="8" fill="#6366f1" opacity=".08"/>

    <!-- Top-right node -->
    <circle cx="650" cy="170" r="30" fill="url(#tipGrad)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="650" cy="170" r="15" fill="#6366f1" opacity=".15"/>
    <circle cx="650" cy="170" r="8" fill="#6366f1" opacity=".08"/>

    <!-- Bottom-left node -->
    <circle cx="550" cy="240" r="30" fill="url(#tipGrad)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="550" cy="240" r="15" fill="#6366f1" opacity=".15"/>
    <circle cx="550" cy="240" r="8" fill="#6366f1" opacity=".08"/>

    <!-- Bottom-right node -->
    <circle cx="650" cy="240" r="30" fill="url(#tipGrad)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="650" cy="240" r="15" fill="#6366f1" opacity=".15"/>
    <circle cx="650" cy="240" r="8" fill="#6366f1" opacity=".08"/>

    <!-- Center connector -->
    <circle cx="600" cy="200" r="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="600" cy="200" r="10" fill="#c97b5d" opacity=".3"/>
  </g>

  <!-- === VIBRATION LINES (movement effect) === -->
  <g stroke="#c97b5d" stroke-opacity=".15" stroke-width="2.5" fill="none">
    <path d="M720,180 Q740,170 720,160"/>
    <path d="M740,200 Q760,190 740,180"/>
    <path d="M730,220 Q750,210 730,200"/>
    <path d="M720,240 Q740,230 720,220"/>
  </g>

  <!-- === WATER DROPLETS === -->
  <g fill="#94a3b8" opacity=".3">
    <ellipse cx="700" cy="280" rx="3" ry="5"/>
    <ellipse cx="480" cy="310" rx="2" ry="4"/>
    <ellipse cx="710" cy="340" rx="2.5" ry="4"/>
    <ellipse cx="490" cy="400" rx="2" ry="3.5"/>
    <ellipse cx="730" cy="460" rx="3" ry="5"/>
    <ellipse cx="460" cy="500" rx="2" ry="3"/>
  </g>
  <g fill="#cbd5e1" opacity=".2">
    <ellipse cx="680" cy="300" rx="4" ry="6"/>
    <ellipse cx="500" cy="350" rx="3" ry="5"/>
    <ellipse cx="720" cy="400" rx="2" ry="4"/>
  </g>

  <!-- Water surface reflection -->
  <ellipse cx="600" cy="760" rx="300" ry="8" fill="url(#water)" opacity=".3"/>

  <!-- === SCENE ELEMENTS === -->

  <!-- Small bamboo plant -->
  <g transform="translate(180, 580)">
    <rect x="15" y="0" width="70" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="-80" stroke="#065f46" stroke-width="4"/>
    <line x1="60" y1="0" x2="70" y2="-70" stroke="#065f46" stroke-width="3.5"/>
    <ellipse cx="30" cy="-90" rx="12" ry="18" fill="#059669" opacity=".6"/>
    <ellipse cx="60" cy="-80" rx="10" ry="15" fill="#047857" opacity=".5"/>
  </g>

  <!-- Towel fold -->
  <path d="M920,700 Q940,690 980,700 Q1020,710 1050,705 Q1080,700 1100,710 L1100,750 Q1080,740 1050,745 Q1020,750 980,740 Q940,730 920,740 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Brand label -->
  <rect x="464" y="840" width="272" height="40" rx="6" fill="#6366f1" opacity=".08"/>
  <text x="600" y="866" text-anchor="middle" fill="#4338ca" font-size="16" font-weight="600" font-family="Inter,system-ui" letter-spacing="2">ELECTRIC SCALP MASSAGER</text>
  <text x="600" y="890" text-anchor="middle" fill="#64748b" font-size="13" font-family="Inter,system-ui">3 Speeds · IPX6 Water-Resistant</text>

  <!-- Nobleparc watermark -->
  <text x="1090" y="1150" text-anchor="end" fill="#0f172a" font-size="20" font-weight="800" font-family="Inter,system-ui" letter-spacing="-0.5" opacity=".06">Nobleparc</text>
</svg>