<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <!-- Warm wellness bedroom gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <!-- Warm glow from mask -->
    <radialGradient id="maskGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#c97b5d;stop-opacity:.4"/>
      <stop offset="40%" style="stop-color:#c97b5d;stop-opacity:.15"/>
      <stop offset="100%" style="stop-color:#c97b5d;stop-opacity:0"/>
    </radialGradient>
    <!-- LED glow -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b4a;stop-opacity:.9"/>
      <stop offset="60%" style="stop-color:#c97b5d;stop-opacity:.5"/>
      <stop offset="100%" style="stop-color:#c97b5d;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nirGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:.6"/>
      <stop offset="60%" style="stop-color:#8b5cf6;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <!-- Product shine -->
    <linearGradient id="silicone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f4"/>
      <stop offset="50%" style="stop-color:#e7e5e4"/>
      <stop offset="100%" style="stop-color:#d6d3d1"/>
    </linearGradient>
    <!-- Ambient light -->
    <radialGradient id="ambientWarm" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:.08"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:0"/>
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background - bedroom at dusk -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#ambientWarm)"/>

  <!-- Subtle wall texture -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#ffffff" stroke-opacity=".03" stroke-width="1"/>
  <line x1="0" y1="800" x2="1200" y2="800" stroke="#ffffff" stroke-opacity=".02" stroke-width="1"/>

  <!-- Window with moonlight -->
  <rect x="850" y="60" width="280" height="400" rx="8" fill="#0c1929" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <rect x="858" y="68" width="264" height="384" rx="4" fill="#0f1f35"/>
  <!-- Moonlight beam -->
  <rect x="858" y="68" width="264" height="384" rx="4" fill="#e2e8f0" opacity=".03"/>

  <!-- Nightstand surface -->
  <rect x="100" y="720" width="1000" height="20" rx="4" fill="#292524" opacity=".8"/>
  <rect x="100" y="720" width="1000" height="4" rx="2" fill="#44403c" opacity=".5"/>

  <!-- Warm glow from mask (ambient) -->
  <ellipse cx="600" cy="530" rx="350" ry="300" fill="url(#maskGlow)"/>

  <!-- === RED LIGHT THERAPY MASK === -->

  <!-- Mask body - outer frame (silicone) -->
  <path d="M350,380 Q350,300 450,280 L520,270 Q550,265 600,260 Q650,265 680,270 L750,280 Q850,300 850,380 L850,580 Q850,660 750,680 L680,690 Q650,695 600,700 Q550,695 520,690 L450,680 Q350,660 350,580 Z"
        fill="url(#silicone)" stroke="#a8a29e" stroke-width="1.5" opacity=".95"/>

  <!-- Mask inner panel -->
  <path d="M400,400 Q400,340 480,320 L540,310 Q570,305 600,302 Q630,305 660,310 L720,320 Q800,340 800,400 L800,560 Q800,620 720,640 L660,650 Q630,655 600,658 Q570,655 540,650 L480,640 Q400,620 400,560 Z"
        fill="#292524" opacity=".85"/>

  <!-- LED glow layer -->
  <path d="M400,400 Q400,340 480,320 L540,310 Q570,305 600,302 Q630,305 660,310 L720,320 Q800,340 800,400 L800,560 Q800,620 720,640 L660,650 Q630,655 600,658 Q570,655 540,650 L480,640 Q400,620 400,560 Z"
        fill="url(#maskGlow)" opacity=".3"/>

  <!-- LED array - Red LEDs (630-660nm) - outer ring -->
  <g filter="url(#softGlow)">
    <!-- Top row red LEDs -->
    <circle cx="460" cy="365" r="10" fill="url(#ledGlow)"/>
    <circle cx="495" cy="350" r="10" fill="url(#ledGlow)"/>
    <circle cx="530" cy="340" r="10" fill="url(#ledGlow)"/>
    <circle cx="565" cy="335" r="10" fill="url(#ledGlow)"/>
    <circle cx="600" cy="333" r="10" fill="url(#ledGlow)"/>
    <circle cx="635" cy="335" r="10" fill="url(#ledGlow)"/>
    <circle cx="670" cy="340" r="10" fill="url(#ledGlow)"/>
    <circle cx="705" cy="350" r="10" fill="url(#ledGlow)"/>
    <circle cx="740" cy="365" r="10" fill="url(#ledGlow)"/>

    <!-- Row 2 -->
    <circle cx="440" cy="400" r="10" fill="url(#ledGlow)"/>
    <circle cx="480" cy="385" r="10" fill="url(#ledGlow)"/>
    <circle cx="520" cy="375" r="10" fill="url(#ledGlow)"/>
    <circle cx="560" cy="368" r="10" fill="url(#ledGlow)"/>
    <circle cx="600" cy="365" r="10" fill="url(#ledGlow)"/>
    <circle cx="640" cy="368" r="10" fill="url(#ledGlow)"/>
    <circle cx="680" cy="375" r="10" fill="url(#ledGlow)"/>
    <circle cx="720" cy="385" r="10" fill="url(#ledGlow)"/>
    <circle cx="760" cy="400" r="10" fill="url(#ledGlow)"/>

    <!-- Row 3 - NIR (near-infrared, purple-ish glow) -->
    <circle cx="445" cy="435" r="10" fill="url(#nirGlow)"/>
    <circle cx="485" cy="420" r="10" fill="url(#nirGlow)"/>
    <circle cx="525" cy="410" r="10" fill="url(#nirGlow)"/>
    <circle cx="565" cy="405" r="10" fill="url(#nirGlow)"/>
    <circle cx="600" cy="402" r="10" fill="url(#nirGlow)"/>
    <circle cx="635" cy="405" r="10" fill="url(#nirGlow)"/>
    <circle cx="675" cy="410" r="10" fill="url(#nirGlow)"/>
    <circle cx="715" cy="420" r="10" fill="url(#nirGlow)"/>
    <circle cx="755" cy="435" r="10" fill="url(#nirGlow)"/>

    <!-- Row 4 -->
    <circle cx="455" cy="470" r="10" fill="url(#ledGlow)"/>
    <circle cx="495" cy="458" r="10" fill="url(#ledGlow)"/>
    <circle cx="535" cy="448" r="10" fill="url(#ledGlow)"/>
    <circle cx="575" cy="442" r="10" fill="url(#ledGlow)"/>
    <circle cx="600" cy="440" r="10" fill="url(#ledGlow)"/>
    <circle cx="625" cy="442" r="10" fill="url(#ledGlow)"/>
    <circle cx="665" cy="448" r="10" fill="url(#ledGlow)"/>
    <circle cx="705" cy="458" r="10" fill="url(#ledGlow)"/>
    <circle cx="745" cy="470" r="10" fill="url(#ledGlow)"/>

    <!-- Row 5 -->
    <circle cx="470" cy="505" r="10" fill="url(#nirGlow)"/>
    <circle cx="510" cy="495" r="10" fill="url(#nirGlow)"/>
    <circle cx="550" cy="488" r="10" fill="url(#nirGlow)"/>
    <circle cx="590" cy="483" r="10" fill="url(#nirGlow)"/>
    <circle cx="600" cy="482" r="10" fill="url(#nirGlow)"/>
    <circle cx="610" cy="483" r="10" fill="url(#nirGlow)"/>
    <circle cx="650" cy="488" r="10" fill="url(#nirGlow)"/>
    <circle cx="690" cy="495" r="10" fill="url(#nirGlow)"/>
    <circle cx="730" cy="505" r="10" fill="url(#nirGlow)"/>

    <!-- Row 6 -->
    <circle cx="490" cy="538" r="10" fill="url(#ledGlow)"/>
    <circle cx="530" cy="528" r="10" fill="url(#ledGlow)"/>
    <circle cx="570" cy="522" r="10" fill="url(#ledGlow)"/>
    <circle cx="600" cy="520" r="10" fill="url(#ledGlow)"/>
    <circle cx="630" cy="522" r="10" fill="url(#ledGlow)"/>
    <circle cx="670" cy="528" r="10" fill="url(#ledGlow)"/>
    <circle cx="710" cy="538" r="10" fill="url(#ledGlow)"/>

    <!-- Row 7 -->
    <circle cx="520" cy="568" r="10" fill="url(#nirGlow)"/>
    <circle cx="560" cy="560" r="10" fill="url(#nirGlow)"/>
    <circle cx="600" cy="556" r="10" fill="url(#nirGlow)"/>
    <circle cx="640" cy="560" r="10" fill="url(#nirGlow)"/>
    <circle cx="680" cy="568" r="10" fill="url(#nirGlow)"/>

    <!-- Bottom row -->
    <circle cx="555" cy="595" r="10" fill="url(#ledGlow)"/>
    <circle cx="600" cy="590" r="10" fill="url(#ledGlow)"/>
    <circle cx="645" cy="595" r="10" fill="url(#ledGlow)"/>
  </g>

  <!-- Nose bridge cutout -->
  <path d="M555,380 Q555,360 570,350 Q585,340 600,338 Q615,340 630,350 Q645,360 645,380"
        fill="#1a1a2e" stroke="#a8a29e" stroke-width="1"/>

  <!-- Eye cutouts -->
  <ellipse cx="510" cy="440" rx="32" ry="16" fill="#1a1a2e" stroke="#a8a29e" stroke-width="1"/>
  <ellipse cx="690" cy="440" rx="32" ry="16" fill="#1a1a2e" stroke="#a8a29e" stroke-width="1"/>

  <!-- Mouth area -->
  <ellipse cx="600" cy="530" rx="28" ry="14" fill="#1a1a2e" opacity=".3"/>

  <!-- Controller unit (right side) -->
  <rect x="860" y="450" width="60" height="120" rx="10" fill="#292524" stroke="#44403c" stroke-width="1.5"/>
  <!-- Power button -->
  <circle cx="890" cy="490" r="12" fill="#c97b5d" opacity=".8"/>
  <circle cx="890" cy="490" r="8" fill="#c97b5d" opacity=".4"/>
  <!-- Timer indicator -->
  <rect x="870" y="520" width="40" height="6" rx="3" fill="#44403c"/>
  <rect x="870" y="520" width="28" height="6" rx="3" fill="#c97b5d" opacity=".6"/>
  <!-- Plus/minus buttons -->
  <text x="878" y="550" fill="#a8a29e" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">+</text>
  <text x="902" y="550" fill="#a8a29e" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">−</text>

  <!-- Cable connecting mask to controller -->
  <path d="M810,510 Q830,510 845,510 Q855,510 860,510" fill="none" stroke="#44403c" stroke-width="3"/>

  <!-- Ambient light reflections on mask surface -->
  <path d="M420,350 Q500,320 600,310 Q700,320 780,350" fill="none" stroke="#c97b5d" stroke-opacity=".08" stroke-width="20" filter="url(#bigGlow)"/>

  <!-- === SCENE ELEMENTS === -->

  <!-- Small plant on nightstand -->
  <line x1="1030" y1="720" x2="1030" y2="660" stroke="#292524" stroke-width="4"/>
  <ellipse cx="1020" cy="650" rx="15" ry="20" fill="#065f46" opacity=".6"/>
  <ellipse cx="1040" cy="645" rx="12" ry="18" fill="#047857" opacity=".5"/>
  <ellipse cx="1030" cy="640" rx="10" ry="15" fill="#059669" opacity=".4"/>

  <!-- Small decorative candle -->
  <rect x="160" y="690" width="40" height="30" rx="6" fill="#292524"/>
  <rect x="165" y="685" width="30" height="10" rx="4" fill="#d97706"/>
  <ellipse cx="180" cy="685" rx="5" ry="3" fill="#f59e0b" opacity=".8"/>
  <!-- Candle glow -->
  <circle cx="180" cy="680" r="6" fill="#f59e0b" opacity=".4" filter="url(#bigGlow)"/>

  <!-- Fabric / blanket texture at bottom -->
  <path d="M0,850 Q100,840 200,850 Q300,860 400,850 Q500,840 600,850 Q700,860 800,850 Q900,840 1000,850 Q1100,860 1200,850 L1200,1200 L0,1200 Z"
        fill="#292524" opacity=".3"/>
  <path d="M0,870 Q100,860 200,870 Q300,880 400,870 Q500,860 600,870 Q700,880 800,870 Q900,860 1000,870 Q1100,880 1200,870 L1200,1200 L0,1200 Z"
        fill="#1c1917" opacity=".4"/>

  <!-- === BRANDING === -->
  <!-- Small product label -->
  <rect x="480" y="750" width="240" height="40" rx="6" fill="#c97b5d" opacity=".15"/>
  <text x="600" y="776" text-anchor="middle" fill="#c97b5d" font-size="16" font-weight="600" font-family="Inter,system-ui" letter-spacing="2">RED LIGHT THERAPY MASK</text>
  <text x="600" y="800" text-anchor="middle" fill="#a8a29e" font-size="13" font-family="Inter,system-ui">180 LEDs · 630-660nm · 830-850nm</text>

  <!-- Subtle Nobleparc watermark -->
  <text x="1090" y="1150" text-anchor="end" fill="#ffffff" font-size="20" font-weight="800" font-family="Inter,system-ui" letter-spacing="-0.5" opacity=".12">Nobleparc</text>

  <!-- Warm ambient overlay -->
  <rect width="1200" height="1200" fill="#c97b5d" opacity=".03"/>
</svg>