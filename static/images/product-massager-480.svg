<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#94a3b8" stroke-width=".3" opacity=".12"/>
    </pattern>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity=".15"/></filter>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#tile)"/>
  <rect x="0" y="320" width="480" height="160" fill="#e2e8f0" opacity=".4"/>
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M215,130 Q215,100 228,80 Q240,65 252,60 L268,60 Q280,65 292,80 Q305,100 305,130 L305,300 Q305,330 292,350 Q280,365 268,370 L252,370 Q240,365 228,350 Q215,330 215,300 Z" fill="url(#body)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Grip lines -->
    <line x1="225" y1="170" x2="295" y2="170" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <line x1="225" y1="190" x2="295" y2="190" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <line x1="225" y1="210" x2="295" y2="210" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <line x1="225" y1="230" x2="295" y2="230" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <line x1="225" y1="250" x2="295" y2="250" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <line x1="225" y1="270" x2="295" y2="270" stroke="#94a3b8" stroke-width=".8" opacity=".3"/>
    <!-- Power button -->
    <rect x="240" y="280" width="40" height="20" rx="10" fill="#292524"/>
    <circle cx="260" cy="290" r="6" fill="#c97b5d" opacity=".75"/>
    <!-- Head -->
    <circle cx="260" cy="110" r="60" fill="url(#body)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Nodes -->
    <circle cx="230" cy="90" r="20" fill="url(#tip)" stroke="#818cf8" stroke-width=".8"/>
    <circle cx="230" cy="90" r="10" fill="#6366f1" opacity=".1"/>
    <circle cx="290" cy="90" r="20" fill="url(#tip)" stroke="#818cf8" stroke-width=".8"/>
    <circle cx="290" cy="90" r="10" fill="#6366f1" opacity=".1"/>
    <circle cx="230" cy="135" r="20" fill="url(#tip)" stroke="#818cf8" stroke-width=".8"/>
    <circle cx="230" cy="135" r="10" fill="#6366f1" opacity=".1"/>
    <circle cx="290" cy="135" r="20" fill="url(#tip)" stroke="#818cf8" stroke-width=".8"/>
    <circle cx="290" cy="135" r="10" fill="#6366f1" opacity=".1"/>
  </g>
  <!-- Vibration effect -->
  <g stroke="#c97b5d" stroke-opacity=".12" stroke-width="1.5" fill="none">
    <path d="M330,100 Q340,95 330,90"/>
    <path d="M340,115 Q350,110 340,105"/>
    <path d="M335,130 Q345,125 335,120"/>
  </g>
  <!-- Label -->
  <rect x="140" y="390" width="200" height="28" rx="4" fill="#6366f1" opacity=".06"/>
  <text x="240" y="410" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="600" font-family="Inter,system-ui" letter-spacing="1">SCALP MASSAGER</text>
  <text x="240" y="425" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,system-ui">3 Speeds · Water-Resistant</text>
</svg>